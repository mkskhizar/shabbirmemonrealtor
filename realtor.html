<!-- ONLY JS PART FIXED — REST UNCHANGED -->
<script>
    // --- Mock Data ---
    const properties = [
        // (UNCHANGED DATA)
    ];

    // --- Application State ---
    let state = {
        city: 'Karachi',
        mode: 'sale',
        category: 'all'
    };

    // --- Functions ---

    function switchCity(cityName) {
        state.city = cityName;
        
        // Update UI Tabs
        document.querySelectorAll('.city-tab').forEach(el => {
            el.classList.remove('active', 'bg-white', 'text-slate-900', 'shadow-md');
            el.classList.add('text-white');
        });

        const activeTab = document.getElementById(`tab-${cityName.toLowerCase()}`);
        activeTab.classList.add('active', 'bg-white', 'text-slate-900', 'shadow-md');
        activeTab.classList.remove('text-white');

        // Update Hero BG & Text
        const heroBg = document.getElementById('hero-bg').querySelector('img');
        const cityText = document.getElementById('hero-city-name');
        
        cityText.textContent = cityName;
        
        if (cityName === 'Karachi') {
            heroBg.src = "https://images.unsplash.com/photo-1580674285054-bed31e145f59?auto=format&fit=crop&q=80&w=2070";
        } else {
            heroBg.src = "https://images.unsplash.com/photo-1589406733276-857e490bc1b9?auto=format&fit=crop&q=80&w=2070";
        }

        renderProperties();
    }

    function setMode(mode) {
        state.mode = mode;
        
        // Update UI
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.remove('active', 'bg-accent', 'text-white', 'border-accent');
            btn.classList.add('bg-slate-50', 'text-slate-600');
        });

        const activeBtn = document.getElementById(`mode-${mode}`);
        activeBtn.classList.remove('bg-slate-50', 'text-slate-600');
        activeBtn.classList.add('active', 'bg-accent', 'text-white');

        renderProperties();
    }

    function setCategory(cat) {
        state.category = cat;

        // Update UI
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        document.getElementById(`cat-${cat}`).classList.add('active');

        renderProperties();
    }

    function renderProperties() {
        const grid = document.getElementById('property-grid');
        const title = document.getElementById('listing-title');
        const countLabel = document.getElementById('listing-count');
        const emptyState = document.getElementById('empty-state');

        // Filter logic
        const filtered = properties.filter(p => {
            return p.city === state.city && 
                   p.mode === state.mode && 
                   (state.category === 'all' || p.type === state.category);
        });

        // Update Title
        const modeText = state.mode === 'sale' ? 'Sale' : 'Rent';
        title.textContent = `${state.category === 'all' ? 'Properties' : capitalize(state.category) + 's'} for ${modeText} in ${state.city}`;
        countLabel.textContent = `${filtered.length} listings found`;

        // Clear Grid FIRST (fix)
        grid.innerHTML = '';

        if (filtered.length === 0) {
            emptyState.classList.remove('hidden');
            return;
        } else {
            emptyState.classList.add('hidden');
        }

        // Generate Cards
        filtered.forEach(p => {
            const card = document.createElement('div');
            card.className = 'property-card bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden group';
            
            const typeBadgeColor = p.type === 'commercial' ? 'bg-blue-600' : (p.type === 'house' ? 'bg-emerald-600' : 'bg-purple-600');
            
            let featuresHtml = '';
            if(p.type !== 'commercial') {
                featuresHtml = `
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bed text-slate-400"></i>
                        <span class="text-sm font-medium">${p.beds}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bath text-slate-400"></i>
                        <span class="text-sm font-medium">${p.baths}</span>
                    </div>
                `;
            } else {
                featuresHtml = `
                     <div class="flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-slate-400"></i>
                        <span class="text-sm font-medium">Floor 2</span>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="img-container relative h-64">
                    <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover">
                    <div class="absolute top-4 left-4 flex gap-2">
                        <span class="${typeBadgeColor} text-white text-xs font-bold px-3 py-1 rounded uppercase tracking-wider shadow-sm">${p.type}</span>
                        <span class="bg-slate-900 text-white text-xs font-bold px-3 py-1 rounded uppercase tracking-wider shadow-sm">For ${p.mode}</span>
                    </div>
                    <div class="absolute bottom-4 right-4">
                         <span class="bg-white/90 backdrop-blur text-primary font-bold px-4 py-2 rounded shadow-lg">
                            ${p.price}
                         </span>
                    </div>
                </div>
                <div class="p-6">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-xl font-bold text-slate-800 group-hover:text-accent transition-colors truncate">${p.title}</h3>
                    </div>
                    <p class="text-slate-500 text-sm mb-4 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot text-accent"></i> ${p.location}
                    </p>
                    <div class="flex items-center gap-6 py-4 border-t border-slate-100 text-slate-600">
                        ${featuresHtml}
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-ruler-combined text-slate-400"></i>
                            <span class="text-sm font-medium">${p.area}</span>
                        </div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <button class="flex-1 bg-primary text-white py-2 rounded hover:bg-slate-800 transition font-medium">View Details</button>
                        <button class="px-3 py-2 border border-slate-200 rounded hover:bg-slate-50 text-slate-600 transition">
                            <i class="fa-regular fa-heart"></i>
                        </button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function capitalize(s) {
        return s && s[0].toUpperCase() + s.slice(1);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        renderProperties();
    });

</script>
